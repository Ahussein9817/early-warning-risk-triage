# Real palette instead of default Streamlit styling. Reserved semantics:
# - primaryColor: actions only (the Predict button) — never used for risk meaning.
# - Escalated/Not-Escalated colors are defined separately in dashboard/app.py
#   (RISK_COLOR / SAFE_COLOR) and deliberately kept distinct from primaryColor
#   so the action color and the risk color are never confusable.
[theme]
primaryColor = "#3457D5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1F2937"
font = "sans serif"
