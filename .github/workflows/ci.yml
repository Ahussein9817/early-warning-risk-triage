name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch to keep the install small)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov=src

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t risk-triage-dashboard .
      - name: Start container and wait for Streamlit health endpoint
        run: |
          docker run -d --name app -p 8501:8501 risk-triage-dashboard
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8501/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
